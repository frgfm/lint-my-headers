- id: lmh-wheel
  name: lmh (native wheel)
  description: Check configured source headers with the released native wheel; requires uv, with no Rust build.
  entry: uv tool run --isolated --no-config --no-build --python ">=3.11" --from lint-my-headers==0.8.0 lmh check
  language: system
  types: [file]
  files: '\.(py|js|jsx|mjs|cjs|ts|tsx|mts|cts|rs|go|swift|sh|bash|c|h|cc|cpp|cxx|c\+\+|C|hh|hpp|hxx|h\+\+|H|ipp|tpp|inl)$'
- id: lmh
  name: lmh
  description: Check headers in the configured languages (Python, JavaScript, TypeScript, Rust, Go, Swift, Bash/shell, C, C++; default Python).
  entry: lmh check
  language: rust
  language_version: "1.93.0"
  types: [file]
  files: '\.(py|js|jsx|mjs|cjs|ts|tsx|mts|cts|rs|go|swift|sh|bash|c|h|cc|cpp|cxx|c\+\+|C|hh|hpp|hxx|h\+\+|H|ipp|tpp|inl)$'
