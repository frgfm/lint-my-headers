version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns:
          - "*"
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    # Ignore routine docs bumps, while keeping security fixes eligible.
    ignore:
      - dependency-name: "zensical"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      tools:
        patterns:
          - "ruff"
          - "ty"
          - "prek"
          - "uv"
          - "maturin"
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: "security-updates"
        patterns:
          - "*"
