name: style

on:
  push:
    branches: main
    paths: &paths [rust/**, src/**, tests/**, scripts/**, Cargo.*, rust-toolchain.toml, pyproject.toml, uv.lock, Makefile,
      .pre-commit*, .github/*.py, .github/workflows/style.yml]
  pull_request:
    branches: main
    paths: *paths

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.13.4"

jobs:
  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {check: ruff, target: lint-check}
          - {check: ty, target: typing-check}
          - {check: prek-hooks, target: prek}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - {if: matrix.target == 'lint-check', run: make deps-check}
      - if: matrix.target == 'prek'
        run: git checkout -b temp
      - run: make "${{ matrix.target }}"
