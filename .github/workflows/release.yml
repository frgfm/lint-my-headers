name: distributions

on:
  pull_request:
    branches: main
    paths: [rust/**, src/**, tests/**, Cargo.*, rust-toolchain.toml, pyproject.toml, uv.lock, Makefile,
      .github/pypi_release.py, .github/smoke_distribution.py, .github/verify_deps_sync.py, .github/workflows/release.yml,
      .github/workflows/update-copyright-years.yml, README.md, LICENSE, .git*]
  release:
    types: [published]

env:
  RELEASE_UV_VERSION: "0.12.5"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - &checkout
        name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.sha }}
      - &setup_uv
        name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: ${{ env.RELEASE_UV_VERSION }}
      - name: Verify tag and package versions
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(uv version --short)"
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $version." >&2
            exit 1
          fi
          python .github/pypi_release.py versions
          make deps-check
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run optimized-mode unit tests
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.93.0"
      - name: Test Rust and release helpers
        env:
          PYTHONOPTIMIZE: "1"
        run: make test
      - name: Build and smoke-test the source distribution
        shell: bash
        run: |
          uv build --sdist --no-sources
          EXPECTED_VERSION="$(uv version --short)" uv run --isolated --no-project --no-binary-package lint-my-headers --with dist/*.tar.gz .github/smoke_distribution.py
      - name: Retain exact release artifacts and publishing checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          path: |
            dist/
            .github/pypi_release.py

  wheels:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - *checkout
      - *setup_uv
      - name: Build native wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: "1.15.0"
          rust-toolchain: "1.93.0"
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked --out dist
      - name: Smoke-test the installed wheel
        if: ${{ !contains(matrix.target, 'musl') }}
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: uv run --python 3.14 --isolated --no-project --with dist/*.whl .github/smoke_distribution.py
      - name: Smoke-test musllinux wheel on Alpine
        if: ${{ contains(matrix.target, 'musl') }}
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: >-
          docker run --rm -e EXPECTED_VERSION -v "$PWD:/io:ro" python:3.14-alpine
          sh -c 'pip install --no-deps /io/dist/*.whl && python /io/.github/smoke_distribution.py'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'release'
    needs: [build, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lint-my-headers
    permissions:
      id-token: write
    steps:
      - *setup_uv
      - &download_source
        name: Download reviewed artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: .
      - &download_wheels
        name: Download reviewed platform wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-wheels-*
          merge-multiple: true
          path: dist
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
      - name: Publish only missing byte-identical artifacts
        run: >-
          python .github/pypi_release.py publish dist
          --version "${{ needs.build.outputs.version }}"

  verify:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - *setup_uv
      - *download_source
      - *download_wheels
      - name: Verify live PyPI filenames and hashes
        run: >-
          python .github/pypi_release.py verify dist
          --version "${{ needs.build.outputs.version }}"
      - name: Verify a clean live installation
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          actual="$(uvx --refresh-package lint-my-headers --from "lint-my-headers==$VERSION" lmh --version)"
          if [[ "$actual" != "lmh $VERSION" ]]; then
            echo "Unexpected installed version: $actual" >&2
            exit 1
          fi
