name: documentation

on:
  push:
    branches: [main]
    paths: &paths [docs/**, zensical.toml, wrangler.toml, pyproject.toml, uv.lock, Makefile,
      .github/prepare_docs_assets.sh, .github/prepare_docs_fonts.sh, .github/workflows/docs.yml]
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.13.4"
  WRANGLER_VERSION: "4.147.0"
  WRANGLER_SEND_METRICS: "false"

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build documentation
        run: make docs-cloudflare
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - name: Validate Wrangler configuration without deploying
        run: npx --yes wrangler@"$WRANGLER_VERSION" deploy --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: .docs-site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
