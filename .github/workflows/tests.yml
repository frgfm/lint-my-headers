name: tests

on:
  push:
    branches: main
    paths: &paths [rust/**, src/**, tests/**, scripts/**, Cargo.*, rust-toolchain.toml, pyproject.toml, uv.lock, Makefile,
      action.yml, .pre-commit*, .github/*.py, .github/*.sh, .github/workflows/tests.yml, .github/workflows/update-copyright-years.yml,
      README.md, LICENSE, .git*]
  pull_request:
    branches: main
    paths: *paths

env:
  PYTHONOPTIMIZE: "1"
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.13.4"

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.93.0"
      - name: Test Rust
        run: cargo test --locked
      - name: Test Python distribution helpers
        run: python -m unittest discover -s src/tests -v

  run-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Check repository headers from configuration
        uses: ./
        with:
          version: source
      - name: Prepare integration fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          notice = (
              "# This program is licensed under the Apache License 2.0.\n"
              "# See LICENSE or go to <https://www.apache.org/licenses/LICENSE-2.0> for full license details.\n"
          )

          def write(path, owner):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(f"# Copyright (C) 2024, {owner}.\n\n{notice}\nvalue = 1\n", encoding="utf-8")

          write(".action-test/success/stale.py", "François-Guillaume Fernandez")
          write(".action-test/mixed/safe.py", "François-Guillaume Fernandez")
          write(".action-test/mixed/bad.py", "Another Owner")
          selection = Path(".action-test/selection")
          (selection / "generated").mkdir(parents=True, exist_ok=True)
          (selection / ".gitignore").write_text("ignored.py\ngenerated/\n", encoding="utf-8")
          for name in ["ignored.py", "generated/out.py"]:
              (selection / name).write_text("value = 1\n", encoding="utf-8")
          (selection / "keep.py").write_text("value = 1\n", encoding="utf-8")
          PY
      - name: Apply .gitignore during directory scans
        id: selection
        continue-on-error: true
        uses: ./
        with:
          version: source
          mode: check
          license: 'Apache-2.0'
          owner: 'François-Guillaume Fernandez'
          starting-year: 2022
          folders: '.action-test/selection'
          ignore-files: ''
          ignore-folders: ''
          respect-gitignore: true
      - name: Verify selection filters
        env:
          ISSUES: ${{ steps.selection.outputs.issues }}
          OUTCOME: ${{ steps.selection.outcome }}
        run: |
          python - <<'PY'
          import json
          import os

          if os.environ["OUTCOME"] != "failure":
              raise SystemExit(f"Expected one remaining header issue, got {os.environ['OUTCOME']}")
          if json.loads(os.environ["ISSUES"]) != [".action-test/selection/keep.py"]:
              raise SystemExit(f"Selection filters missed files: {os.environ['ISSUES']}")
          PY
      - name: Fix a stale header
        id: fix
        uses: ./
        with: &fix_inputs
          version: source
          mode: fix
          license: 'Apache-2.0'
          owner: 'François-Guillaume Fernandez'
          starting-year: 2022
          folders: '.action-test/success'
          ignore-files: ''
          ignore-folders: ''
      - name: Save first fix
        shell: bash
        env:
          CHANGED: ${{ steps.fix.outputs.changed }}
          ISSUES: ${{ steps.fix.outputs.issues }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          if json.loads(os.environ["ISSUES"]) != []:
              raise SystemExit(f"Unexpected issues: {os.environ['ISSUES']}")
          if json.loads(os.environ["CHANGED"]) != [".action-test/success/stale.py"]:
              raise SystemExit(f"Unexpected changed files: {os.environ['CHANGED']}")
          source = Path(".action-test/success/stale.py")
          Path(os.environ["RUNNER_TEMP"], "fixed.py").write_bytes(source.read_bytes())
          PY
      - name: Run fix a second time
        id: second-fix
        uses: ./
        with: *fix_inputs
      - name: Verify idempotence
        shell: bash
        env:
          CHANGED: ${{ steps.second-fix.outputs.changed }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          source = Path(".action-test/success/stale.py")
          if source.read_bytes() != Path(os.environ["RUNNER_TEMP"], "fixed.py").read_bytes():
              raise SystemExit("Second fix changed the source")
          if json.loads(os.environ["CHANGED"]) != []:
              raise SystemExit(f"Second fix reported changes: {os.environ['CHANGED']}")
          if f"Copyright (C) 2024-{datetime.now().year}" not in source.read_text(encoding="utf-8"):
              raise SystemExit("Current year was not written")
          PY
      - name: Fix safe files and fail on ambiguity
        id: mixed
        continue-on-error: true
        uses: ./
        with:
          version: source
          mode: fix
          license: 'Apache-2.0'
          owner: 'François-Guillaume Fernandez'
          starting-year: 2022
          folders: '.action-test/mixed'
          ignore-files: ''
          ignore-folders: ''
      - name: Verify fail-closed repair
        shell: bash
        env:
          CHANGED: ${{ steps.mixed.outputs.changed }}
          ISSUES: ${{ steps.mixed.outputs.issues }}
          OUTCOME: ${{ steps.mixed.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          if os.environ["OUTCOME"] != "failure":
              raise SystemExit(f"Unexpected action outcome: {os.environ['OUTCOME']}")
          if json.loads(os.environ["ISSUES"]) != [".action-test/mixed/bad.py"]:
              raise SystemExit(f"Unexpected issues: {os.environ['ISSUES']}")
          if json.loads(os.environ["CHANGED"]) != [".action-test/mixed/safe.py"]:
              raise SystemExit(f"Unexpected changed files: {os.environ['CHANGED']}")
          if f"Copyright (C) 2024-{datetime.now().year}" not in Path(
              ".action-test/mixed/safe.py"
          ).read_text(encoding="utf-8"):
              raise SystemExit("Safe file was not repaired")
          if "Another Owner" not in Path(".action-test/mixed/bad.py").read_text(encoding="utf-8"):
              raise SystemExit("Ambiguous file changed")
          PY
      - name: Verify tracked files are unchanged
        run: git diff --exit-code

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: ${{ env.UV_VERSION }}
      - name: Build and smoke-test distributions
        run: make package-check
      - name: Exercise the wheel-only Action without a published release
        uses: ./
        env:
          UV_OFFLINE: "true"
          UV_FIND_LINKS: ${{ github.workspace }}/dist
      - name: Reject floating package versions
        id: unpinned
        uses: ./
        continue-on-error: true
        with:
          version: latest
      - name: Verify version rejection
        env:
          OUTCOME: ${{ steps.unpinned.outcome }}
        run: test "$OUTCOME" = failure
      - name: Exercise the first-party hook
        run: |
          make quality-env
          uv run --no-sync --group quality prek try-repo . lmh --all-files
      - name: Exercise the wheel-only local hook
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          hook = {
              "id": "lmh", "name": "Lint My Headers", "entry": "lmh check",
              "language": "python", "types": ["file"],
              "additional_dependencies": ["--only-binary=lint-my-headers", next(Path("dist").glob("*.whl")).resolve().as_uri()],
          }
          Path(os.environ["RUNNER_TEMP"], "lmh-wheel.json").write_text(json.dumps({"repos": [{"repo": "local", "hooks": [hook]}]}))
          PY
          uv run --no-sync --group quality prek run --config "$RUNNER_TEMP/lmh-wheel.json" --all-files

  wheel-hook:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        engine: [pre-commit, prek]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: ${{ env.UV_VERSION }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.93.0"
      - name: Build smoke-test artifacts
        run: uv build --no-sources
      - name: Test fresh wheel hook without compiling Rust
        shell: bash
        run: bash .github/smoke_wheel_hook.sh --engine ${{ matrix.engine }} --dist dist

  deps-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Run dependency sync checker
        run: |
          make deps-check
          make spdx-check

  legacy-action-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check headers through legacy Action inputs
        uses: ./
        with:
          version: source
          license: 'Apache-2.0'
          owner: 'François-Guillaume Fernandez'
          starting-year: 2022
          folders: 'src,.github'
          # collect_env.py retains its upstream-specific Apache notice.
          ignore-files: 'version.py,__init__.py,collect_env.py'
          ignore-folders: ''
