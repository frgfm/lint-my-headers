[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[project]
name = "lint-my-headers"
version = "0.7.0"
description = "Agent-ready license-header linting for Python, JavaScript, TypeScript, Rust, Go, Swift, Bash/shell, C, and C++"
requires-python = ">=3.11,<4.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "François-Guillaume Fernandez", email = "fg-feedback@protonmail.com" }]
maintainers = [{ name = "François-Guillaume Fernandez", email = "fg-feedback@protonmail.com" }]
readme = "README.md"
keywords = ["python", "javascript", "typescript", "rust", "go", "swift", "bash", "shell", "c", "cpp", "legal headers", "copyright", "license", "linter", "pre-commit", "github action", "spdx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Documentation = "https://docs.fgfm.dev/lint-my-headers/"
Issues = "https://github.com/frgfm/lint-my-headers/issues"
Changelog = "https://github.com/frgfm/lint-my-headers/releases"
Repository = "https://github.com/frgfm/lint-my-headers"

[tool.maturin]
bindings = "bin"
module-name = "lint_my_headers"
python-source = "src"
locked = true
strip = true
exclude = ["src/tests/**", "**/__pycache__/**", "**/*.pyc"]
include = [{ path = "src/lint_my_headers/*.json", format = "sdist" }]

[tool.lint-my-headers]
owner = "François-Guillaume Fernandez"
starting-year = 2022
license = "Apache-2.0"
paths = ["src", ".github", "scripts"]
ignore-files = ["version.py", "__init__.py", "collect_env.py"]
ignore-folders = [".agents/skills/lint-my-headers/evals/files"]

[dependency-groups]
build = ["uv>=0.12.20"]
docs = ["zensical==0.0.68"]
quality = [
    "ruff==0.16.10",
    "ty==0.0.84",
    "prek==0.5.5",
]

[tool.ruff]
line-length = 120
target-version = "py311"
preview = true

[tool.ruff.lint]
select = [
    "F",  # pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # isort
    "N",  # pep8-naming
    # "D101", "D103",  # pydocstyle missing docstring in public function/class
    "D201","D202","D207","D208","D214","D215","D300","D301","D417", "D419",  # pydocstyle
    "YTT",  # flake8-2020
    "ANN",  # flake8-annotations
    "ASYNC",  # flake8-async
    "S",  # flake8-bandit
    "BLE",  # flake8-blind-except
    "B",  # flake8-bugbear
    "A",  # flake8-builtins
    "COM",  # flake8-commas
    "CPY",  # flake8-copyright
    "C4",  # flake8-comprehensions
    "T10",  # flake8-debugger
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "LOG",  # flake8-logging
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "PYI",  # flake8-pyi
    "PT",  # flake8-pytest-style
    "Q",  # flake8-quotes
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "PERF",  # perflint
    "NPY",  # numpy
    "FAST",  # fastapi
    "FURB",  # refurb
    "RUF",  # ruff specific
]
ignore = [
    "RUF201",  # keep concise rule-code selectors
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from
    "C901",  # too complex
    "F403",  # star imports
    "E731",  # lambda assignment
    "C416",  # list comprehension to list()
    "ANN002",  # missing type annotations on *args
    "ANN003",  # missing type annotations on **kwargs
    "COM812",  # trailing comma missing
    "ISC001",  # implicit string concatenation (handled by format)
    "G004",  # logging-fstring-interpolation
]
exclude = [".git", ".agents/skills/lint-my-headers/evals/files/**"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.isort]
known-first-party = []
known-third-party = []

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["I001", "F401", "CPY001"]
".github/**.py" = ["D", "T201", "ANN"]
"src/**.py" = ["ANN"]
"src/tests/**.py" = ["D103", "CPY001", "S101", "T201", "ANN001", "ANN201", "ARG001", "PT009", "PT027"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
