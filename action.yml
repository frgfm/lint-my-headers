name: Lint My Headers
author: frgfm
description: Lint source legal headers and conservatively refresh recognized copyright years
branding:
  icon: check-square
  color: blue

inputs:
  version:
    description: 'Exact stable/RC PyPI version; defaults to this ref’s package version. Use source to build this checkout.'
    required: false
    default: ''
  owner:
    description: 'Name of the copyright owner; overrides project configuration'
    required: false
    default: '__from_config__'
  starting-year:
    description: 'Earliest accepted file start year; overrides project configuration'
    required: false
    default: '__from_config__'
  license:
    # https://spdx.org/licenses/
    description: 'SPDX license identifier; overrides project configuration'
    required: false
    default: '__from_config__'
  folders:
    description: 'Folders to inspect; overrides project configuration'
    required: false
    default: '__from_config__'
  ignore-files:
    description: 'Files to ignore; overrides project configuration'
    required: false
    default: '__from_config__'
  ignore-folders:
    description: 'Folders to ignore; overrides project configuration'
    required: false
    default: '__from_config__'
  license-notice:
    description: 'Custom license notice; overrides project configuration'
    required: false
    default: '__from_config__'
  mode:
    description: 'Whether to check or fix existing headers'
    required: false
    default: 'check'

outputs:
  issues:
    description: 'Compact JSON list of files with unresolved header issues'
    value: ${{ steps.validate.outputs.issues }}
  changed:
    description: 'Compact JSON list of files changed by fix mode'
    value: ${{ steps.validate.outputs.changed }}

runs:
  using: 'composite'
  steps:
    - name: Install uv
      if: inputs.version != 'source'
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: "0.13.4"
        enable-cache: false
    - name: Install Rust
      if: inputs.version == 'source'
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      with:
        toolchain: "1.93.0"
    - name: Lint My Headers
      id: validate
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_OWNER: ${{ inputs.owner }}
        INPUT_STARTING_YEAR: ${{ inputs.starting-year }}
        INPUT_LICENSE: ${{ inputs.license }}
        INPUT_FOLDERS: ${{ inputs.folders }}
        INPUT_IGNORE_FILES: ${{ inputs.ignore-files }}
        INPUT_IGNORE_FOLDERS: ${{ inputs.ignore-folders }}
        INPUT_LICENSE_NOTICE: ${{ inputs.license-notice }}
        INPUT_MODE: ${{ inputs.mode }}
      run: |
        args=("$INPUT_MODE")
        if [[ "$INPUT_OWNER" != '__from_config__' ]]; then args+=(--owner "$INPUT_OWNER"); fi
        if [[ "$INPUT_STARTING_YEAR" != '__from_config__' ]]; then args+=(--starting-year "$INPUT_STARTING_YEAR"); fi
        if [[ "$INPUT_LICENSE" != '__from_config__' ]]; then args+=(--license "$INPUT_LICENSE"); fi
        if [[ "$INPUT_FOLDERS" != '__from_config__' ]]; then args+=(--folders "$INPUT_FOLDERS"); fi
        if [[ "$INPUT_IGNORE_FILES" != '__from_config__' ]]; then args+=(--ignore-files "$INPUT_IGNORE_FILES"); fi
        if [[ "$INPUT_IGNORE_FOLDERS" != '__from_config__' ]]; then args+=(--ignore-folders "$INPUT_IGNORE_FOLDERS"); fi
        if [[ "$INPUT_LICENSE_NOTICE" != '__from_config__' ]]; then args+=(--license-notice "$INPUT_LICENSE_NOTICE"); fi
        if [[ "$INPUT_VERSION" == 'source' ]]; then
          (cd "$GITHUB_ACTION_PATH" && cargo build --quiet --locked --release --target-dir "$GITHUB_ACTION_PATH/target" --bin lmh)
          "$GITHUB_ACTION_PATH/target/release/lmh" "${args[@]}"
        else
          version="${INPUT_VERSION:-$(uv --no-config --directory "$GITHUB_ACTION_PATH" version --short)}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]]; then
            echo "Expected an exact release version or 'source', got: $version" >&2
            exit 2
          fi
          uv tool run --isolated --no-config --no-build --python '>=3.11' --from "lint-my-headers==$version" lmh "${args[@]}"
        fi
