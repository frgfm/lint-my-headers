name = "lint-my-headers-docs"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

# A Custom Domain owns the hostname and provisions DNS and TLS.
# Assets are staged below /lint-my-headers/ by make docs-cloudflare.
routes = [{ pattern = "docs.fgfm.dev", custom_domain = true }]

[assets]
directory = ".docs-site"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

# Enable isolated Worker Previews for branches and pull requests.
[previews]
