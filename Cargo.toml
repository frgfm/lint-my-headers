[package]
name = "lint-my-headers"
version = "0.7.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
description = "Agent-ready license-header linting for Python, JavaScript, TypeScript, Rust, Go, Swift, Bash/shell, C, and C++"
repository = "https://github.com/frgfm/lint-my-headers"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "lmh"
path = "rust/main.rs"

[[bin]]
name = "lint-my-headers"
path = "rust/long_main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
tempfile = "3"
pathdiff = "0.2"

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
sha2 = "0.11"

[profile.release]
strip = true
lto = "thin"
