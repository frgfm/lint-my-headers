[project]
site_name = "Lint My Headers"
site_description = "Check source copyright and license headers across nine languages, safely refresh stale years, and integrate Lint My Headers with CI and coding agents."
site_url = "https://docs.fgfm.dev/lint-my-headers/"
repo_url = "https://github.com/frgfm/lint-my-headers"
repo_name = "frgfm/lint-my-headers"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/fonts.css"]
nav = [
  { "Overview" = "index.md" },
  { "Compare header tools" = "comparison.md" },
  { "Getting started" = "getting-started.md" },
  { "Configuration" = "configuration.md" },
  { "Integrations" = "integrations.md" },
  { "Diagnostics & agents" = "diagnostics.md" },
  { "Performance" = "benchmarks.md" },
]

[project.theme]
variant = "modern"
language = "en"
font = false
logo = "assets/images/logo.svg"
favicon = "assets/images/logo.svg"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.markdown_extensions]
admonition = {}
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
toc.permalink = true
